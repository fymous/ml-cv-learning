# Polygons are normalized 0–1 (x, y). Draw them against your own sample video.
zones:
  # Entrance counting is most accurate with a directed tripwire `line` instead
  # of a polygon: a person who steps in and straight back out never completes an
  # inward crossing, so they are not double-counted.
  #   line:         two points [ [ax,ay], [bx,by] ] the person walks across
  #   in_direction: vector pointing INTO the venue (here [0,1] = downward in the
  #                 frame). Omit it to treat the left of the a->b arrow as inside.
  # A polygon is still allowed (legacy presence counting) if no line is given.
  - id: entrance-1
    type: entrance
    name: Door
    line:
      - [0.30, 0.75]
      - [0.70, 0.75]
    in_direction: [0.0, 1.0]
    polygon:
      - [0.30, 0.55]
      - [0.70, 0.55]
      - [0.70, 0.95]
      - [0.30, 0.95]
  # Anyone whose feet enter a `staff` (or `exclude`) zone is tagged staff and
  # is not counted as a visitor — e.g. the security guard's post by the door.
  - id: staff-1
    type: staff
    name: Guard post
    polygon:
      - [0.72, 0.55]
      - [0.98, 0.55]
      - [0.98, 0.98]
      - [0.72, 0.98]
  - id: queue-1
    type: queue
    name: Line
    polygon:
      - [0.05, 0.35]
      - [0.40, 0.35]
      - [0.40, 0.90]
      - [0.05, 0.90]
  - id: kit-1
    type: kit
    name: Bench
    polygon:
      - [0.55, 0.20]
      - [0.95, 0.20]
      - [0.95, 0.70]
      - [0.55, 0.70]
  # `dwell` zones measure time-in-zone per visitor (features/dwell_time.py) —
  # completely separate from entrance counting above. Draw one per aisle/
  # section you want a "how long did they browse here" metric for.
  - id: dwell-1
    type: dwell
    name: Produce aisle
    polygon:
      - [0.05, 0.10]
      - [0.45, 0.10]
      - [0.45, 0.50]
      - [0.05, 0.50]
  # `service` zones drive customer-attendance / unattended alerting
  # (features/attendance.py). A customer standing here with no staff coming
  # within ~1.5m for 5s raises an "unattended" alert; once a staff member
  # attends them, they're latched attended. Needs a `staff` zone (or uniform)
  # so staff are identified and not counted as customers.
  - id: service-1
    type: service
    name: Display counter
    polygon:
      - [0.50, 0.25]
      - [0.95, 0.25]
      - [0.95, 0.75]
      - [0.50, 0.75]
  # `enroll` zone: onboarding spot where staff stand so the app learns their
  # uniform colour (features/staff_identity.py). Used only during the "Learn
  # staff uniform" step, not at run time.
  - id: enroll-1
    type: enroll
    name: Staff stand here
    polygon:
      - [0.35, 0.30]
      - [0.65, 0.30]
      - [0.65, 0.70]
      - [0.35, 0.70]
